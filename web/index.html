<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickernel Web - WebGPU Renderer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background-color: #222;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            font-family: monospace;
            color: #0f0;
            z-index: 1000;
            pointer-events: none;
        }

        #error {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(255, 0, 0, 0.9);
            padding: 15px;
            border-radius: 5px;
            color: #fff;
            display: none;
            z-index: 1001;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div id="info">
        <div>Tickernel Web</div>
        <div id="status">Initializing...</div>
        <div id="fps">FPS: 0</div>
    </div>
    <div id="error"></div>

    <script type="module" src="app.js"></script>
</body>

</html>

</html>
